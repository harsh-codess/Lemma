<svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3200 1620" fill="none" width="100%">
  <rect width="3200" height="1620" fill="#09090b"/>

  <defs>
    <!-- Fine ruler ticks pattern -->
    <pattern id="minor-ticks" x="0" y="0" width="38" height="14" patternUnits="userSpaceOnUse">
      <line x1="0" y1="14" x2="0" y2="7" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <!-- Bar gradient (fades out at right edge) -->
    <linearGradient id="bar-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0.09"/>
      <stop offset="85%" stop-color="white" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="bar-grad-2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0.0"/>
      <stop offset="15%" stop-color="white" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.085"/>
    </linearGradient>
    <!-- Glow for current marker -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Faint grid lines clip -->
    <clipPath id="chart-clip">
      <rect x="-400" y="400" width="4400" height="900"/>
    </clipPath>
  </defs>

  <!-- ─────────────────────────────────────────────── -->
  <!--  Entire chart rotated ~13° CCW, like original   -->
  <!-- ─────────────────────────────────────────────── -->
  <g transform="rotate(-13 1600 920)">

    <!-- ── Background subtle diagonal grid ── -->
    <g opacity="0.04" clip-path="url(#chart-clip)">
      <line x1="250"  y1="400" x2="250"  y2="1300" stroke="white" stroke-width="1"/>
      <line x1="730"  y1="400" x2="730"  y2="1300" stroke="white" stroke-width="1"/>
      <line x1="1210" y1="400" x2="1210" y2="1300" stroke="white" stroke-width="1"/>
      <line x1="1690" y1="400" x2="1690" y2="1300" stroke="white" stroke-width="1"/>
      <line x1="2170" y1="400" x2="2170" y2="1300" stroke="white" stroke-width="1"/>
      <line x1="2650" y1="400" x2="2650" y2="1300" stroke="white" stroke-width="1"/>
      <line x1="3130" y1="400" x2="3130" y2="1300" stroke="white" stroke-width="1"/>
    </g>

    <!-- ── Ruler line ── -->
    <line x1="-300" y1="550" x2="3500" y2="550" stroke="white" stroke-opacity="0.14" stroke-width="1.5"/>

    <!-- ── Fine tick marks via pattern ── -->
    <rect x="-300" y="538" width="3800" height="14" fill="url(#minor-ticks)"/>

    <!-- ── Major tick marks ── -->
    <g stroke="white" stroke-opacity="0.3" stroke-width="1.5">
      <line x1="250"  y1="550" x2="250"  y2="530"/>
      <line x1="730"  y1="550" x2="730"  y2="530"/>
      <line x1="1210" y1="550" x2="1210" y2="530"/>
      <line x1="1690" y1="550" x2="1690" y2="530"/>
      <line x1="2170" y1="550" x2="2170" y2="530"/>
      <line x1="2650" y1="550" x2="2650" y2="530"/>
    </g>

    <!-- ── Sub-tick labels ── -->
    <g fill="white" fill-opacity="0.22" font-family="'Inter', system-ui, sans-serif" font-size="30" text-anchor="middle">
      <text x="490"  y="515">7</text>
      <text x="970"  y="515">14</text>
      <text x="1450" y="515">21</text>
      <text x="1930" y="515">28</text>
    </g>

    <!-- ── Phase / date labels ── -->
    <g fill="white" fill-opacity="0.38" font-family="'Inter', system-ui, sans-serif" font-size="30" letter-spacing="2" text-anchor="middle">
      <text x="250"  y="515">WEEK 1</text>
      <text x="730"  y="515">WEEK 2</text>
      <text x="1210" y="515">WEEK 3</text>
      <text x="2170" y="515">MONTH 2</text>
      <text x="2650" y="515">MONTH 3</text>
    </g>

    <!-- ── Current marker pill (highlighted, like "AUG 22" in original) ── -->
    <rect x="1600" y="500" width="180" height="50" rx="8" fill="white" fill-opacity="0.95"/>
    <text x="1690" y="534" text-anchor="middle" fill="#09090b"
          font-family="'Inter', system-ui, sans-serif" font-size="28" font-weight="700" letter-spacing="1">WEEK 4</text>

    <!-- ── Current marker vertical dashed line ── -->
    <line x1="1690" y1="550" x2="1690" y2="1100"
          stroke="white" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="10 7"/>

    <!-- ══════════════════════════════════════ -->
    <!--  BAR 1 — "Paper Analysis"             -->
    <!--  Spans WEEK 1 → mid-WEEK 3            -->
    <!--  x: 80 → 1380,  y: 610 → 666         -->
    <!-- ══════════════════════════════════════ -->
    <rect x="80" y="610" width="1300" height="56" rx="10"
          fill="url(#bar-grad)" stroke="white" stroke-opacity="0.13" stroke-width="1"/>

    <!-- Bar label — left-aligned, large, above bar (like original) -->
    <text x="70" y="600" text-anchor="end"
          fill="white" fill-opacity="0.88"
          font-family="'Inter', system-ui, sans-serif" font-size="44" font-weight="300">Paper Analysis</text>

    <!-- Sub-label inside bar ("Scored" like "Beta") -->
    <text x="720" y="646" text-anchor="middle"
          fill="white" fill-opacity="0.32"
          font-family="'Inter', system-ui, sans-serif" font-size="28">Scored</text>

    <!-- Sub-label below-left ("Upload" like "Prototype") -->
    <text x="230" y="704" text-anchor="middle"
          fill="white" fill-opacity="0.28"
          font-family="'Inter', system-ui, sans-serif" font-size="28">Upload</text>

    <!-- Milestone diamond — green (like original green diamond) at x=450 -->
    <g transform="translate(450, 638)" filter="url(#glow)">
      <rect x="-14" y="-14" width="28" height="28" rx="4" fill="#4ade80" transform="rotate(45)"/>
    </g>

    <!-- Small milestone diamond at end of bar (gray, like original right diamond) -->
    <g transform="translate(1340, 638)">
      <rect x="-10" y="-10" width="20" height="20" rx="3" fill="#9ca3af" transform="rotate(45)"/>
    </g>

    <!-- ══════════════════════════════════════ -->
    <!--  BAR 2 — "Pitch Generator"            -->
    <!--  Spans WEEK 2 → MONTH 3              -->
    <!--  x: 900 → 2900,  y: 750 → 806        -->
    <!-- ══════════════════════════════════════ -->
    <rect x="900" y="750" width="2000" height="56" rx="10"
          fill="url(#bar-grad-2)" stroke="white" stroke-opacity="0.13" stroke-width="1"/>

    <!-- Bar label -->
    <text x="890" y="740" text-anchor="end"
          fill="white" fill-opacity="0.88"
          font-family="'Inter', system-ui, sans-serif" font-size="44" font-weight="300">Pitch Generator</text>

    <!-- Sub-label inside bar -->
    <text x="1900" y="786" text-anchor="middle"
          fill="white" fill-opacity="0.32"
          font-family="'Inter', system-ui, sans-serif" font-size="28">Deck Export</text>

    <!-- Sub-label below-left -->
    <text x="1100" y="844" text-anchor="middle"
          fill="white" fill-opacity="0.28"
          font-family="'Inter', system-ui, sans-serif" font-size="28">Review</text>

    <!-- Milestone diamond cluster — multi-color (like original right double-diamond) at x=2820 -->
    <g transform="translate(2820, 778)">
      <!-- Outer diamond -->
      <rect x="-16" y="-16" width="32" height="32" rx="4" fill="white" fill-opacity="0.18" transform="rotate(45)"/>
      <!-- Inner diamond 1 (purple) -->
      <rect x="-10" y="-10" width="20" height="20" rx="3" fill="#a78bfa" transform="rotate(45)"/>
    </g>

    <!-- Second milestone on bar 2 (small, gray) at mid-point -->
    <g transform="translate(1690, 778)">
      <rect x="-9" y="-9" width="18" height="18" rx="3" fill="#6b7280" transform="rotate(45)"/>
    </g>

    <!-- Connector dashed line between end of bar1 and start of bar2 (subtle) -->
    <line x1="1380" y1="666" x2="1380" y2="750"
          stroke="white" stroke-opacity="0.07" stroke-width="1" stroke-dasharray="5 5"/>

  </g>
</svg>
